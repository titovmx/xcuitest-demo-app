name: ToDoApp
options:
  bundleIdPrefix: io.qase
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ToDoApp:
    type: application
    platform: iOS
    sources:
      - path: ToDoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.qase.ToDoApp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  ToDoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ToDoAppUITests
    dependencies:
      - target: ToDoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.qase.ToDoAppUITests
        TEST_TARGET_NAME: ToDoApp
schemes:
  ToDoApp:
    build:
      targets:
        ToDoApp: all
        ToDoAppUITests: [test]
    test:
      targets:
        - ToDoAppUITests
