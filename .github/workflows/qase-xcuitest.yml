# Generated by Qase · GitHub Actions · XCUITest
# Commit this file to .github/workflows/qase-xcuitest.yml
name: 'XCUITest (Qase)'

on:
  # Qase fills these in when you press "Start Run" on an automated test run.
  workflow_dispatch:
    inputs:
      qase_run_id:        { description: 'Existing Qase run ID to report into', required: false }
      qase_project_code:  { description: 'Qase project code',                  required: false }
      qase_report:        { description: 'Upload results (1 = yes)', required: false, default: '1' }
      qase_run_complete:  { description: 'Complete the run (1 = yes)', required: false, default: '1' }
      qase_api_base_url:  { description: 'Qase API base URL',                  required: false }
  push:
    branches: ['main']

concurrency:
  group: qase-xcuitest-${{ github.ref }}
  cancel-in-progress: true

env:
  QASE_PROJECT_CODE: ${{ 'JUL' }}
  QASE_API_BASE_URL: ${{ 'https://api.qase.io/v1' }}
  QASECTL_VERSION: v0.4.0
  XCODE_APP: /Applications/Xcode_16.4.app
  XCRESULT_PATH: build/TestResults.xcresult

jobs:
  xcuitest:
    name: XCUITest on iOS Simulator
    runs-on: macos-15
    timeout-minutes: 60
    env:
      QASE_TESTOPS_API_TOKEN: ${{ secrets.QASE_TESTOPS_API_TOKEN_JUL }}
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 16.4
        run: sudo xcode-select --switch "$XCODE_APP"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Install the Qase CLI
        run: |
          ARCH=$([ "$(uname -m)" = "arm64" ] && echo arm64 || echo amd64)
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/qasectl" \
            "https://github.com/qase-tms/qasectl/releases/download/${QASECTL_VERSION}/qasectl-darwin-${ARCH}"
          chmod +x "$RUNNER_TEMP/bin/qasectl"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Resolve the Qase test run
        id: qase_run
        run: |
          if [ -n "${{ inputs.qase_run_id }}" ]; then
            echo "id=${{ inputs.qase_run_id }}" >> "$GITHUB_OUTPUT"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          qasectl testops run create --project "$QASE_PROJECT_CODE" --token "$QASE_TESTOPS_API_TOKEN" \
            --title "GitHub Actions #${{ github.run_number }} (${{ github.ref_name }})" \
            --description "Commit ${{ github.sha }}" --output qase.env
          echo "id=$(grep QASE_TESTOPS_RUN_ID qase.env | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "created=true" >> "$GITHUB_OUTPUT"

      # Lets Qase show the GitHub run status on the test run dashboard.
      - name: Link this workflow run to the Qase run
        if: inputs.qase_run_id != ''
        run: |
          curl -fsS -X POST "$QASE_API_BASE_URL/apps/external_link/$QASE_PROJECT_CODE/github-app/" \
            -H "Token: $QASE_TESTOPS_API_TOKEN" -H 'Content-Type: application/json' \
            -d '{"run_id": ${{ steps.qase_run.outputs.id }}, "external_run_id": "${{ github.run_id }}"}'

      - name: Run XCUITests
        run: |
          xcodebuild test \
            -project 'ToDoApp.xcodeproj' \
            -scheme 'ToDoApp' \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath "$XCRESULT_PATH" \
            -parallel-testing-enabled YES \
            -maximum-parallel-testing-workers 2 \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload results to Qase
        if: always() && (inputs.qase_report || '1') != '0' && steps.qase_run.outputs.id != ''
        run: |
          qasectl testops result upload --project "$QASE_PROJECT_CODE" --token "$QASE_TESTOPS_API_TOKEN" \
            --id "${{ steps.qase_run.outputs.id }}" --format xctest --steps user \
            --path "$XCRESULT_PATH" --verbose

      - name: Complete the Qase run
        if: always() && steps.qase_run.outputs.id != '' && (steps.qase_run.outputs.created == 'true' || inputs.qase_run_complete != '0')
        run: |
          qasectl testops run complete --project "$QASE_PROJECT_CODE" \
            --token "$QASE_TESTOPS_API_TOKEN" --id "${{ steps.qase_run.outputs.id }}"

      - name: Upload the .xcresult bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ github.run_id }}
          path: build/TestResults.xcresult
          if-no-files-found: warn
